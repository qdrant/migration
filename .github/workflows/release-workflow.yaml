name: Release

on:
  push:
    branches:
      - 'releases/**'

jobs:
  Release:
    environment: release
    name: Release Workflow
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a github release
      contents: write
      pull-requests: write
      id-token: write # needed for cosign keyless signing with OIDC
    outputs:
      tag: ${{ steps.extract_build_info.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the release commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          main=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          picked_from_main() {
            local commit=$1 merges parent source tree want
            merges=$(git rev-list --no-walk --count --min-parents=2 "$commit") || return 1
            [ "$merges" = 0 ] || return 1
            parent=$(git rev-parse --verify --quiet "$commit^") || return 1
            source=$(git log -1 --format=%B "$commit" | sed -n 's/^(cherry picked from commit \([0-9a-f]\{40\}\))$/\1/p' | tail -n 1) || return 1
            [ -n "$source" ] || return 1
            git merge-base --is-ancestor "$source" "$main" || return 1
            tree=$(git --attr-source="$parent" merge-tree --write-tree --no-messages --merge-base="$source^" "$parent" "$source") || return 1
            want=$(git rev-parse --verify "$commit^{tree}") || return 1
            [ "$tree" = "$want" ]
          }
          on_main=0
          git merge-base --is-ancestor HEAD "$main" || on_main=$?
          if [ "$on_main" != 0 ]; then
            [ "$on_main" = 1 ]
            commits=$(git rev-list "$main..HEAD")
            [ -n "$commits" ]
            rejected=""
            for commit in $commits; do
              picked_from_main "$commit" || rejected="$rejected $(git rev-parse --short "$commit")"
            done
            if [ -n "$rejected" ]; then
              echo "::error::$(git rev-parse --short HEAD) has commits that are not on main:$rejected. Releases are cut from main, hotfixes use git cherry-pick -x of commits already on main, without changes"
              exit 1
            fi
          fi

      - name: Extract build info
        id: extract_build_info
        run: |
          tag="${GITHUB_REF##*/}"
          if [[ ! "${tag}" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release ref must end in a semver version, got: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to registry.cloud.qdrant.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.cloud.qdrant.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Set Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            registry.cloud.qdrant.io/library/qdrant-migration
          tags: |
            type=raw,value=${{ steps.extract_build_info.outputs.tag }}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-and-push
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.extract_build_info.outputs.tag }}
            BUILD=${{ steps.extract_build_info.outputs.commit_short }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container image at registry.cloud.qdrant.io
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false --yes "${TAGS}@${DIGEST}"
        env:
          TAGS: registry.cloud.qdrant.io/library/qdrant-migration:${{ steps.extract_build_info.outputs.tag }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

      - name: Tag Release
        shell: bash
        run: |
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ steps.extract_build_info.outputs.tag }}

      - name: Publish Release Notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          disable-autolabeler: true
          commitish: ${{ github.ref }}
          tag: ${{ steps.extract_build_info.outputs.tag }}
          name: ${{ steps.extract_build_info.outputs.tag }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Binaries:
    environment: release
    name: Publish Binaries
    needs: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.Release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_CERTIFICATE_P12_FILE: ${{ secrets.APPLE_CERTIFICATE_P12_FILE }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
